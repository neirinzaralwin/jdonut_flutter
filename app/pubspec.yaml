name: jdonut
description: J'Donuts customer app — Madivizion Senior Flutter code test.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.8.0

# Dependencies are added by tool/bootstrap.sh (`flutter pub add`) so they resolve to the
# latest stable versions on your machine. Do not hand-pin versions here.
dependencies:
  cached_network_image: ^4.0.6
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.3
  intl: ^0.20.3
  json_annotation: ^4.12.0
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.8
  shimmer: ^4.0.0
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.10
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/seed/
    - assets/images/products/
    - assets/images/banners/
    - assets/images/shops/
    - assets/images/onboarding/
    - assets/images/rewards/
